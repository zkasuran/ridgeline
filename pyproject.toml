[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ridgeline"
version = "0.1.0"
description = "Producer-agnostic label-localization QA and a gated ridge snapper for Vesuvius Challenge segmentation labels"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "tifffile>=2023.7",
]

[project.scripts]
ridgeline = "ridgeline.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["ridgeline"]
